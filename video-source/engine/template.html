<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Thai Tran Hoang Nha | Personal Brand</title>
<style>
@font-face { font-family: "IN"; src: url("assets/fonts/inter-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "IN"; src: url("assets/fonts/inter-700.woff2") format("woff2"); font-weight: 700; }
@font-face { font-family: "Yu Gothic UI"; src: local("Yu Gothic UI"); }
@font-face { font-family: "Meiryo"; src: local("Meiryo"); }
@font-face { font-family: "Malgun Gothic"; src: local("Malgun Gothic"); }
@font-face { font-family: "SG"; src: url("assets/fonts/sg-var.woff2") format("woff2"); font-weight: 300 700; }
:root {
  --bg:#FFFFFF; --bg2:#F8FAFC; --surf:#FFFFFF; --surf2:#F6F9FC; --line:#E2E8F0; --line2:#CBD5E1;
  --ink:#1E293B; --body:#475569; --muted:#64748B; --acc:#25A1DB; --acc2:#E06E20; --acc3:#1B7FB0; --accDim:rgba(37,161,219,.12);
  --orange:#F47E2A; --shadow:0 1px 3px rgba(15,23,42,.05), 0 10px 28px rgba(15,23,42,.08);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1920px; height:1080px; overflow:hidden; background:var(--bg); }
#root { position:relative; width:1920px; height:1080px; overflow:hidden; background:var(--bg); font-family:"IN", sans-serif; color:var(--ink);
  -webkit-font-smoothing:antialiased; }
/* ambient */
#bg { position:absolute; inset:0; background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%); }
#glowA, #glowB { position:absolute; border-radius:50%; filter:blur(140px); pointer-events:none; }
#glowA { width:900px; height:900px; left:-260px; top:-320px; background:#25A1DB; opacity:.08; }
#glowB { width:800px; height:800px; right:-280px; bottom:-360px; background:#F47E2A; opacity:.06; }
#grid { position:absolute; inset:0; opacity:.55; pointer-events:none;
  background-image: linear-gradient(to right, rgba(15,23,42,.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(15,23,42,.05) 1px, transparent 1px);
  background-size: 160px 160px; background-position: 0 0;
  -webkit-mask-image: radial-gradient(1100px 700px at 50% 45%, #FFFFFF 35%, transparent 85%); }
#grain { display:none; }
#vig { position:absolute; inset:0; pointer-events:none; background: radial-gradient(1300px 820px at 50% 50%, transparent 70%, rgba(226,232,240,.45) 100%); }
#stage, #trans, #xfer { position:absolute; inset:0; }
#trans, #xfer { pointer-events:none; }
/* scenes */
.scene { position:absolute; inset:0; opacity:0; visibility:hidden; }
.cam { position:absolute; inset:0; transform-origin:50% 46%; }
/* chapter marker (top band, outside the cam) */
#chap { position:absolute; left:72px; top:56px; display:flex; align-items:center; gap:16px; font-family:"SG"; font-weight:500; font-size:20px;
  letter-spacing:.2em; text-transform:uppercase; color:var(--muted); z-index:60; opacity:0; visibility:hidden; }
#chap .k { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:8px; border:1px solid var(--line2);
  color:var(--acc2); font-weight:600; letter-spacing:0; }
#chap .nm { color:var(--body); }
#chap .sep { width:28px; height:1px; background:var(--line2); }
#chap .idx { color:var(--muted); }
#prog { position:absolute; left:0; top:0; height:3px; width:1920px; background:linear-gradient(90deg, var(--acc3), var(--acc2)); transform-origin:0 50%; z-index:61; opacity:.85; }
/* captions: plain type on a soft band, no pill (style v2.4) */
#capband { position:absolute; left:0; right:0; top:880px; height:200px; pointer-events:none;
  background:linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,.80) 45%, rgba(255,255,255,.95) 100%); z-index:58; }
#caps { position:absolute; left:0; right:0; top:930px; height:90px; z-index:59; }
.cap { position:absolute; left:50%; top:0; transform:translateX(-50%); max-width:1400px; width:max-content; text-align:center;
  font-family:"IN"; font-weight:400; font-size:34px; line-height:1.3; color:rgba(30,41,59,.5); opacity:0; letter-spacing:-.005em; }
.cap .w { display:inline; }
/* shared type */
.eyebrow { font-family:"SG"; font-weight:500; font-size:22px; letter-spacing:.24em; text-transform:uppercase; color:var(--acc2); }
.hl { font-family:"IN"; font-weight:700; color:var(--ink); letter-spacing:-.03em; line-height:1.04; }
.hl em { font-style:normal; color:var(--acc2); }
.bd { font-family:"IN"; font-weight:400; color:var(--body); font-size:28px; line-height:1.4; }
.num { font-family:"SG"; font-weight:600; letter-spacing:-.02em; color:var(--ink); font-variant-numeric:tabular-nums; }
.lbl { font-family:"SG"; font-weight:500; font-size:20px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.line { display:block; overflow:hidden; }
.line .in { display:inline-block; }
/* hairline card (no drop shadow) */
.hc { position:absolute; border:1px solid var(--line); border-radius:18px; background:linear-gradient(180deg, #FFFFFF, #F6F9FC); box-shadow:var(--shadow); }
.hc.acc { border-color:rgba(37,161,219,.55); box-shadow:0 0 0 1px rgba(37,161,219,.12), 0 0 40px -10px rgba(37,161,219,.45); }
.chip { position:absolute; display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 18px; border-radius:22px; border:1px solid var(--line2);
  font-family:"SG"; font-weight:500; font-size:21px; letter-spacing:.04em; color:var(--ink); background:rgba(255,255,255,.9); white-space:nowrap; }
.chip.acc { border-color:var(--acc); color:var(--acc2); background:rgba(37,161,219,.10); }
.dot { position:absolute; border-radius:50%; background:var(--line2); }
.dot.acc { background:var(--acc); box-shadow:0 0 18px rgba(37,161,219,.8); }
/* nx helpers */
.nx-ul { position:absolute; left:0; bottom:-10px; width:100%; height:3px; background:var(--acc); transform-origin:0 50%; border-radius:2px; }
.nx-gbar { position:absolute; top:0; height:1080px; background:linear-gradient(180deg, #EAF6FC, #D6EEF9); border-left:1px solid rgba(37,161,219,.35); }
.nx-leak { position:absolute; left:-200px; top:-200px; width:2400px; height:1500px; pointer-events:none;
  background:radial-gradient(900px 600px at 50% 50%, rgba(244,126,42,.55), rgba(37,161,219,.22) 40%, transparent 70%);  }
.nx-dipline { position:absolute; left:160px; right:160px; top:539px; height:2px; background:linear-gradient(90deg, transparent, var(--acc2), transparent); }
.nx-shot { position:absolute; border-radius:12px; overflow:hidden; border:1px solid var(--line2); background:#FFFFFF;
  box-shadow:0 30px 60px -20px rgba(15,23,42,.8), 0 0 0 1px rgba(15,23,42,.04); opacity:0; }
.nx-shot .bar { height:22px; display:flex; align-items:center; gap:6px; padding:0 10px; background:#F1F5F9; border-bottom:1px solid var(--line); }
.nx-shot .bar i { width:8px; height:8px; border-radius:50%; background:#CBD5E1; display:block; }
.nx-shot img { display:block; width:100%; height:auto; }
.nxi { display:block; }
.ch { display:inline-block; white-space:pre; }
</style>
</head>
